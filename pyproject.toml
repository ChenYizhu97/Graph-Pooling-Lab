[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gplab"
version = "0.1.0"
description = "Graph pooling benchmark harness for graph classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "packaging",  # PyTorch 2.1 imports this without declaring it in wheel metadata.
    "rich",
    "toml",
    "torch>=2.1",
    "torch-geometric>=2.4",
    "tqdm",
    "typer",
]

[project.scripts]
gplab-train = "gplab.cli.train_cli:app"
gplab-run-job = "gplab.cli.run_train_job:app"
gplab-query = "gplab.cli.query:app"
gplab-replay = "gplab.cli.replay:app"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
