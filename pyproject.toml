[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gplab"
version = "0.1.0"
description = "Graph pooling benchmark harness for graph classification."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2,<3",
    "rich",
    "torch==2.10.0",
    "torch-geometric>=2.6",
    "torch-geometric-pool==1.0.2",
    "scikit-learn",  # TGP 1.0.2 imports its spectral selector eagerly.
    "typer",
]

[project.scripts]
gplab-train = "gplab.cli.train_cli:app"
gplab-run-job = "gplab.cli.run_train_job:app"
gplab-query = "gplab.cli.query:app"
gplab-replay = "gplab.cli.replay:app"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.uv]
# Binary extensions for the locked PyTorch 2.10 / CUDA 12.8 environment.
find-links = ["https://data.pyg.org/whl/torch-2.10.0+cu128.html"]

constraint-dependencies = ["torch-scatter==2.1.2+pt210cu128"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
