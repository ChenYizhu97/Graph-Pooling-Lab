# Shared pooling input: binary discards weights; scalar preserves semantic edge weights.
input_type = "binary"

[compression]
mode = "native"
# For matched mode, set target_retention to a fraction in (0, 1].

[training]
num_runs = 10
lr = 0.0005
batch_size = 32
patience = 50
epochs = 500
activation_checkpoint = false

[training.split]
train = 0.8
val = 0.1

[training.seeds]
mode = "auto"
base = 20260320
allow_duplicates = false
